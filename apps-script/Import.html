<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font-family: -apple-system, sans-serif; font-size: 13px; margin: 0; padding: 16px; color: #1a1d24; }
      p { line-height: 1.5; color: #5b6068; }
      textarea { width: 100%; height: 200px; box-sizing: border-box; font-family: monospace; font-size: 11px; padding: 8px; border: 1px solid #dde0e4; border-radius: 4px; }
      button { margin-top: 10px; padding: 8px 14px; border-radius: 6px; border: none; background: #23262e; color: #fff; font-size: 13px; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 10px; font-size: 12px; white-space: pre-wrap; }
      .error { color: #c23636; }
      .ok { color: #1a7a4c; }
    </style>
  </head>
  <body>
    <p>
      업무관리 시스템 관리자 설정 → 데이터(DB) 구조 → <b>전체 JSON 내보내기</b>로 받은
      내용을 아래에 붙여넣고 가져오기를 누르세요.
      <b style="color: #c23636">주의: 지금 이 12개 시트에 있는 데이터는 전부 지워지고,
      붙여넣은 JSON 내용으로 통째로 교체됩니다.</b> 백업해두고 싶으면 가져오기 전에
      시트를 사본으로 복사해두세요.
    </p>
    <textarea id="json" placeholder="여기에 JSON 전체를 붙여넣으세요"></textarea>
    <div>
      <button id="run">가져오기</button>
    </div>
    <div id="status"></div>
    <script>
      document.getElementById("run").addEventListener("click", function () {
        var btn = document.getElementById("run");
        var status = document.getElementById("status");
        var text = document.getElementById("json").value.trim();
        if (!text) return;
        if (!window.confirm("지금 시트의 기존 데이터가 전부 지워지고 이 JSON으로 교체됩니다. 계속할까요?")) return;
        btn.disabled = true;
        status.className = "";
        status.textContent = "가져오는 중...";
        google.script.run
          .withSuccessHandler(function (counts) {
            btn.disabled = false;
            status.className = "ok";
            status.textContent = "완료:\n" + JSON.stringify(counts, null, 2);
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            status.className = "error";
            status.textContent = "오류: " + (err && err.message ? err.message : err);
          })
          .importExportedJson(text);
      });
    </script>
  </body>
</html>
